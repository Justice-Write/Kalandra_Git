name: Dependency Audit

# Gating item "Pin & audit dependencies" (docs/ROADMAP.md): audit the exact,
# committed dependency set (requirements-lock.txt) for known vulnerabilities
# with pip-audit. No install needed: --disable-pip --no-deps audits the pins
# as written, so a Windows-generated lock audits fine on a Linux runner.
# Runs on every change to the requirements files, weekly (new advisories land
# against old pins), and on demand.

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'        # Mondays 06:17 UTC
  push:
    branches: [ main ]
    paths:
      - 'scripts/check_security_runtime.py'
      - 'tests/test_security_runtime.py'
      - 'requirements.txt'
      - 'requirements-lock.txt'
      - '.github/workflows/dependency-audit.yml'
  pull_request:
    paths:
      - 'scripts/check_security_runtime.py'
      - 'tests/test_security_runtime.py'
      - 'requirements.txt'
      - 'requirements-lock.txt'
      - '.github/workflows/dependency-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.16'

      - name: Bootstrap fixed pip with vendor-published hash
        run: python -m pip install --disable-pip-version-check "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
      - name: Check Python security floor offline
        run: python scripts/check_security_runtime.py --runtime-only

      - name: Install pip-audit
        run: python -m pip install --upgrade pip-audit

      - name: Test offline runtime security preflight
        run: python -m unittest discover -s tests -p test_security_runtime.py

      - name: Audit the locked dependency set
        run: pip-audit -r requirements-lock.txt --disable-pip --no-deps --progress-spinner off
